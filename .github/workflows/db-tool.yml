name: Outil base de données (recherche / ajout de tournoi)
on:
  workflow_dispatch:
    inputs:
      mode: { description: "find ou tournament", required: true, default: "find" }
      query: { description: "Texte à chercher (find) ou org/cat (tournament)", required: true }
      data: { description: "JSON du tournoi (mode tournament)", required: false, default: "" }
jobs:
  outil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/db-tool.mjs
        env: { MODE: "${{ inputs.mode }}", QUERY: "${{ inputs.query }}", DATA: "${{ inputs.data }}" }
